# On a v* tag, build release binaries, publish a GitHub Release with
# SHA256SUMS, and attach notes from CHANGELOG.md. Nothing here runs on a
# pull request. This does not publish to npm or crates.io.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.83.0
        shell: bash
        run: |
          set -euo pipefail
          if [ "${RUNNER_OS}" = "Windows" ]; then
            curl -sSfL -o rustup-init.exe https://win.rustup.rs/x86_64
            ./rustup-init.exe -y --default-toolchain 1.83.0 --profile minimal
            echo "${USERPROFILE}/.cargo/bin" >> "${GITHUB_PATH}"
          else
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.83.0 --profile minimal
            echo "${HOME}/.cargo/bin" >> "${GITHUB_PATH}"
          fi

      - name: Add target
        shell: bash
        run: rustup target add "${TARGET}"
        env:
          TARGET: ${{ matrix.target }}

      - name: Build
        shell: bash
        run: cargo build --release --locked --target "${TARGET}"
        env:
          TARGET: ${{ matrix.target }}

      - name: Pack
        shell: bash
        run: |
          set -euo pipefail
          ext=""
          if [ "${RUNNER_OS}" = "Windows" ]; then
            ext=".exe"
          fi
          version="${GITHUB_REF_NAME#v}"
          name="libellus-${version}-${TARGET}"
          mkdir -p "dist/${name}" release-asset
          cp "target/${TARGET}/release/libellus${ext}" \
             "target/${TARGET}/release/libellus-mcp${ext}" \
             "dist/${name}/"
          if [ "${ARCHIVE}" = "zip" ]; then
            powershell.exe -NoProfile -Command "Compress-Archive -Path 'dist/${name}' -DestinationPath 'release-asset/${name}.zip'"
          else
            tar -C dist -czf "release-asset/${name}.tar.gz" "${name}"
          fi
          ls -l release-asset
        env:
          TARGET: ${{ matrix.target }}
          ARCHIVE: ${{ matrix.archive }}

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: release-asset/
          if-no-files-found: error

  github-release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download archives
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums and changelog notes
        run: |
          set -euo pipefail
          cd dist
          ls -l
          sha256sum *.tar.gz *.zip | sort > SHA256SUMS
          sha256sum -c SHA256SUMS
          cd ..
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="${version}" '
            $0 ~ "^## " ver "( |$)" { found = 1; print; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no section for ${version}"
            exit 1
          fi
          cat notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${tag}" dist/*.tar.gz dist/*.zip dist/SHA256SUMS \
              --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${tag}" dist/*.tar.gz dist/*.zip dist/SHA256SUMS \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${tag}" \
              --notes-file notes.md
          fi
